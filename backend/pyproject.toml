[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dotsfam"
version = "0.1.0"
description = "An always-on team of AI agents: a Chief of Staff who delegates, specialists with their own models and computers, routines, webhooks, and approval before anything irreversible."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "tanuku-saikarthik" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "langchain-anthropic>=1.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "croniter>=2.0",
  "aiosqlite>=0.20",
  "pywebpush>=2.0",
]

[project.optional-dependencies]
computer = ["playwright>=1.45", "docker>=7.0"]
slack = ["slack-bolt>=1.20", "aiohttp>=3.9"]
voice = ["pipecat-ai[webrtc,silero,whisper,kokoro]>=1.12,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
dotsfam = "dotsfam.main:run"

[tool.hatch.build.targets.wheel]
packages = ["dotsfam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]
